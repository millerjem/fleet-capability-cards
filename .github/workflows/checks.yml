name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - run: npx tsc
      - run: npm pack --dry-run
      - run: docker build -t fleet-capability-cards:demo .
      - name: Verify demo container
        run: |
          docker run -d --name fleet-cards -p 127.0.0.1:8080:8080 fleet-capability-cards:demo
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/ | grep 'Fleet capability cards'
      - name: Container logs on failure
        if: failure()
        run: docker logs fleet-cards || true
  react18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm install --no-save --package-lock=false react@18.3.1 react-dom@18.3.1
      - run: npm test
